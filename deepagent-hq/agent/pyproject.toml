[project]
name = "hq-agent"
version = "0.1.0"
description = "Self-hosted DeepAgent: coding-first orchestrator with subagents, Docker sandboxes, and markets research."
requires-python = ">=3.12,<3.13"

# Pinned exactly on purpose: deepagents is a fast-moving beta and minor bumps
# have shipped breaking changes (e.g. 0.7.0 removed default todo planning and
# backend factories). Upgrade deliberately: bump, run `make test`, read the changelog.
dependencies = [
    "deepagents==0.7.19",
    "aegra-cli==0.6.0",
    "aegra-api==0.6.0",
    "langgraph==1.2.12",
    "langchain==1.4.2",
    "langchain-anthropic==1.7.4",
    "langchain-ollama==1.1.0",
    "docker==7.2.0",
    "httpx==0.28.1",
    "markdownify==1.2.3",
    # aegra-api 0.6.0 uses SQLAlchemy asyncio but doesn't declare greenlet; the
    # server crashes at import without it (caught in the Phase 0 boot test).
    "greenlet==3.5.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hq_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: needs a reachable Docker daemon and the sandbox image",
]
